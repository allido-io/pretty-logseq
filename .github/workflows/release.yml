name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Release PRs opened with GITHUB_TOKEN don't trigger workflows, so use an
      # org GitHub App token to get the required CI checks on them.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: node
          token: ${{ steps.app-token.outputs.token }}

  build-and-upload:
    name: Build & Upload Release Artifact
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin
        run: pnpm build

      - name: Package release zip
        run: |
          mkdir -p pretty-logseq/assets/logos
          cp package.json README.md manifest.json LICENSE.md pretty-logseq/
          cp assets/logos/pretty-logseq-logo.png pretty-logseq/assets/logos/
          mv dist pretty-logseq/
          zip -r pretty-logseq.zip pretty-logseq

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.release-please.outputs.tag_name }} pretty-logseq.zip
          gh release upload ${{ needs.release-please.outputs.tag_name }} package.json
